<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda d'Alina</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FCF4EB">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<script async id="sbjs" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Nunito:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#FCF4EB;--card:#FFFBF5;--ink:#4B3D3A;--muted:#7C6A63;--line:#F0E1D4;--acc:#CF6B64;--red:#A9433C;--ok:#9DBF86;--todo:#EBAE6B;--late:#E28F86}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);height:100%;overscroll-behavior:none}
body{position:fixed;inset:0;overflow:hidden}
body{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.page{display:block}
.phone{width:100%;max-width:760px;margin:0 auto;height:100vh;height:100dvh;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;font-family:Nunito,sans-serif}
.hf{font-family:"Zen Maru Gothic",sans-serif;font-weight:700}
.nf{font-family:Nunito,sans-serif;font-weight:700}
.mx{background:color-mix(in srgb,var(--d) var(--p,17%),var(--card));border:1px solid color-mix(in srgb,var(--d) 38%,var(--card))}
.ghost{background:color-mix(in srgb,var(--ink) 6%,var(--bg))}
.tint{background:color-mix(in srgb,var(--d) 31%,var(--card));color:color-mix(in srgb,var(--d) 50%,var(--ink))}
.ic{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:11px}
header{padding:calc(env(safe-area-inset-top) + 20px) 14px 10px 18px;display:flex;align-items:center;gap:10px}
.dnum{font-family:Nunito,sans-serif;font-weight:800;font-size:56px;line-height:.9;letter-spacing:-1.5px}
.dtxt{display:flex;flex-direction:column;line-height:1.15}
.dtxt b{font-family:"Zen Maru Gothic",sans-serif;font-size:23px}
.dtxt span{font-size:18px;color:var(--muted);font-weight:600;white-space:nowrap}
.wx{flex:none;display:flex;align-items:center;gap:8px;padding:4px 14px 4px 4px;border-radius:20px;--d:#A4BED3;text-align:left}
.wx small{display:block;font-size:11.5px;color:var(--muted);line-height:1.25;white-space:nowrap}
.gear{flex:none;width:30px;height:30px;border-radius:15px;display:grid;place-items:center;opacity:.7}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;padding-top:4px;padding-bottom:150px;scrollbar-width:none}
.scroll::-webkit-scrollbar,.hs::-webkit-scrollbar{display:none}
.hs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.seg{display:flex;gap:3px;padding:4px;border-radius:16px}
.seg button{flex:1;height:40px;border-radius:12px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 5px rgba(75,50,45,.12)}
.bar{display:flex;align-items:center;gap:8px}
.nav40{width:40px;height:40px;border-radius:20px;display:grid;place-items:center}
.today-btn{height:36px;padding:0 14px;border-radius:18px;background:color-mix(in srgb,var(--acc) 16%,var(--card));color:var(--red);font-size:13px;font-weight:700}
.ttl{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12px;color:var(--muted)}
/* Légende (petites bulles, sans titre) */
.leg{display:flex;flex-wrap:wrap;gap:5px;padding:12px 16px 0}
.leg button{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 9px 0 2px;border-radius:999px;font-size:9.5px;font-weight:600;color:var(--muted)}
.leg .ic{width:26px;height:26px;border-radius:13px}
/* Jour */
.day{position:relative;margin:0 14px 0 8px}
.hl{position:absolute;left:0;width:30px;text-align:right;font-size:12px;color:var(--muted);transform:translateY(-50%);font-weight:600}
.hl.soft{opacity:.45}
.ev{position:absolute;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:18px;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:12px;font-size:13px}
.chip .ic{width:24px;height:24px;border-radius:8px}
/* Semaine */
.week{display:flex;gap:4px;padding:4px 14px 0}
.wcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:16px;padding:8px 0 12px;background:var(--card);min-height:max(330px,calc(100dvh - 455px - env(safe-area-inset-top) - env(safe-area-inset-bottom)))}
.wcol.we{background:color-mix(in srgb,#C4A8C9 16%,var(--card))}.wcol.we small,.wcol.we b{color:#7E5F86}
.wcol.today{box-shadow:0 0 0 2px var(--acc);background:color-mix(in srgb,var(--acc) 20%,var(--card))}.wcol.today b,.wcol.today small{color:var(--red)}
.wcol .ic{cursor:pointer;position:relative}
.wcol{position:relative}
.wdots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;align-items:center;gap:3px}.wdots i{width:5px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--d) 80%,#6B5A55)}
.wbar{position:absolute;left:-2px;right:-2px;height:3px;background:color-mix(in srgb,var(--d) 55%,transparent)}
.wbar.s{left:5px;border-radius:3px 0 0 3px}.wbar.e{right:5px;border-radius:0 3px 3px 0}.wbar.s.e{border-radius:3px}
.flg{position:absolute;top:-5px;right:-6px;width:17px;height:17px;border-radius:9px;background:var(--card);display:grid;place-items:center;box-shadow:0 1px 3px rgba(75,50,45,.18)}
.adb{--p:42%;font-weight:700;padding-right:16px}
.cytop{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:12px 16px 12px 8px}
.cycard{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:14px}
.cygrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px 2px;justify-items:center}
.cyc{position:relative;width:38px;height:38px;border-radius:19px;font-size:14px;font-weight:600;color:var(--ink);display:grid;place-items:center}
.cyc.out{opacity:.35}.cyc.p{background:#EDA5B0;color:#FFFBF5}.cyc.q{background:#F7E3DE}.cyc.f{background:#E3EDD9}
.cyc.today{box-shadow:inset 0 0 0 2px var(--acc)}.cyc.sel{box-shadow:0 0 0 2px var(--ink)}
.cyc i{position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:2px;background:#C4A8C9}
.cyleg{display:flex;justify-content:center;gap:14px;margin-top:10px;font-size:12px;color:var(--muted)}.cyleg span{display:flex;align-items:center;gap:5px}.cyleg i{width:10px;height:10px;border-radius:5px}
.cyflows{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.cyf{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:16px;border:1px solid var(--line);font-size:11.5px;font-weight:600;color:var(--muted)}
.cyf.on{background:#FBE3E6;border-color:#EDA5B0;color:var(--ink)}
.cysex{display:grid;grid-template-columns:1fr 1fr;gap:6px}.cysex .cyf{flex-direction:row;justify-content:center;height:44px;font-size:13px}
.cymoods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.cym{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:16px;font-size:11px;line-height:1.15;text-align:center;font-weight:600;color:var(--muted);border:1px solid transparent}
.cym.on{background:#FBE3E6;border-color:#EDA5B0;color:var(--ink)}
.cyd{position:absolute;bottom:3px;left:50%;margin-left:-3.5px;width:7px;height:8.4px}
.mc{position:relative}
.cyw{position:absolute;left:0;right:0;bottom:4px;display:flex;justify-content:center;line-height:0}
.cyl{position:absolute;left:8px;right:8px;bottom:2px;height:2px;border-radius:1px;background:#EDA5B0}.cyl.q{background:#F3D3D7}
.avant{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.wcol small{font-size:10px;color:var(--muted)}
.wcol b{font-weight:500;font-size:18px;line-height:1.1;margin-bottom:4px}
.wcol .ic{width:36px;height:36px;border-radius:12px}
/* Mois */
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mdow{text-align:center;font-size:12px;color:var(--muted);padding-bottom:6px}
.mc{height:58px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding-top:6px;display:flex;flex-direction:column;align-items:center;gap:4px}
.mc.we{background:color-mix(in srgb,#C4A8C9 16%,var(--card));border-color:color-mix(in srgb,#C4A8C9 35%,var(--card))}.mc.we b{color:#7E5F86}
.mdow.we{color:#7E5F86;font-weight:700}
.mc.out{opacity:.4}.mc.today{border:2px solid var(--acc);background:color-mix(in srgb,var(--acc) 24%,var(--card))}
.mc b{font-size:15px;font-weight:500}.mc.today b{color:var(--red);font-weight:700}
.mdots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:36px}.mdots i{width:7px;height:7px;border-radius:4px;background:var(--d)}
/* Tâches */
.folders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 20px 12px}
.fold{border-radius:22px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;--p:12%;opacity:.85}
.fold.on{--p:34%;opacity:1;box-shadow:0 0 0 2px color-mix(in srgb,var(--d) 75%,var(--ink))}
.fold .l{font-size:13px;font-weight:700}
.fold .fc{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;margin-left:3px;border-radius:10px;font-size:11px;font-weight:800;background:var(--card);color:var(--muted);border:1px solid color-mix(in srgb,var(--d) 50%,var(--card))}
.fold .fc.hot{background:var(--acc);color:var(--card);border-color:var(--acc)}
.pips{display:flex;gap:3px;align-items:center;justify-content:center;min-height:8px;flex-wrap:wrap}
.pips i{width:7px;height:7px;border-radius:4px;background:color-mix(in srgb,var(--d) 75%,var(--ink))}
.pips.hot i{background:var(--acc)}
.pips em{font-style:normal;font-size:10px;font-weight:800;color:var(--muted);margin-left:1px}
.filters{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 6px;padding:0 16px 12px}
.fb{flex:none;width:31px;height:31px;border-radius:16px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.fb.th{background:color-mix(in srgb,var(--d) 22%,var(--card));border-color:color-mix(in srgb,var(--d) 45%,var(--card));color:color-mix(in srgb,var(--d) 50%,var(--ink))}
.fb.on{box-shadow:0 0 0 2px color-mix(in srgb,var(--d,#7C6A63) 75%,var(--ink));background:color-mix(in srgb,var(--d,#CEC3BB) 40%,var(--card));color:var(--ink)}
.fb{position:relative}.fb{margin-top:6px}.fbn{position:absolute;top:-7px;right:-4px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:var(--card);color:var(--ink);font-size:9.5px;font-weight:700;line-height:15px;text-align:center;box-shadow:0 1px 3px rgba(75,50,45,.18)}
.fb.all{width:auto;padding:0 7px;font-size:12px;font-weight:700}
.fname{font-size:12px;font-weight:700;color:var(--muted)}
.task{display:grid;grid-template-columns:46px minmax(0,1fr) 34px;grid-template-rows:auto auto;column-gap:12px;row-gap:8px;padding:12px;border-radius:22px;align-items:center}
.task .tile{grid-row:1/3;width:46px;height:46px;border-radius:15px;align-self:start}
.task .body{min-width:0;display:flex;flex-direction:column;gap:4px}
.task .foot{grid-column:2/4;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:26px}
.task .chk{grid-column:3;grid-row:1;width:40px;height:40px;border-radius:14px;background:color-mix(in srgb,var(--d) 22%,var(--card));border:1.5px solid color-mix(in srgb,var(--d) 55%,var(--card));display:grid;place-items:center;justify-self:end;transition:background .25s}
.task.done .chk{background:color-mix(in srgb,var(--d) 70%,var(--card));border-color:color-mix(in srgb,var(--d) 85%,var(--ink))}
@keyframes slideL{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(-40px);opacity:.3}to{transform:none;opacity:1}}
.slideL{animation:slideL .22s ease-out}.slideR{animation:slideR .22s ease-out}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(.75)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1)}}
@keyframes squish{0%{transform:scale(1)}40%{transform:scale(.97)}100%{transform:scale(1)}}
.pop{animation:pop .45s ease-out}
.pop .ck{stroke-dasharray:24;animation:draw .35s .12s ease-out both}
@keyframes fly{0%{transform:none;opacity:1}100%{transform:translateY(46px) scale(.6);opacity:0}}
.fly{animation:fly .45s ease-in forwards}
.popcard{animation:squish .4s ease-out}
.burst{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.burst i{position:absolute;left:-5px;top:-5px;width:10px;height:10px;animation:burst .7s ease-out forwards}
.chk{position:relative}
.task.done{opacity:.7}.task.done .ttl{text-decoration:line-through}
.dchip{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;height:25px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink);background:var(--card);border:1px solid color-mix(in srgb,var(--d,#CEC3BB) 60%,var(--card))}
.dchip.today{background:#FBE3C8;border-color:#EEB87D;color:#7E4A1C}.dchip.late{background:#F8D9D4;border-color:#E8A094;color:#9C3F36}
.din{font:inherit;font-size:16px;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;height:46px;padding:0 14px;min-width:150px;text-align:center;-webkit-appearance:none;appearance:none}
.din::-webkit-date-and-time-value{text-align:center}
.dots{display:inline-flex;gap:4px;align-items:center}
.dots i{width:8px;height:8px;border-radius:4px;background:color-mix(in srgb,var(--ink) 10%,var(--card))}
.dots i.f{background:color-mix(in srgb,var(--d) 75%,var(--ink))}
.dots.hot i.f{background:var(--acc)}
.procr{flex:none;display:grid;place-items:center;width:40px;height:34px;padding:0;border-radius:13px;font-size:0;font-weight:500;color:var(--red);background:#F9E3DF;border:1px solid #EBB3AC}
.undo{font-size:12px;color:var(--muted);text-decoration:underline}
.task.u1,.task.u2,.task.u3{--d:#E8A094}
.task.u2{--p:24%}
.task.u3{--p:38%;border:2px solid var(--acc);box-shadow:0 6px 18px rgba(207,107,100,.22)}
.bang{min-width:40px;height:28px;padding:0 10px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:17px;letter-spacing:1px;color:#B8362D;background:#FFFBF5;border:1.5px solid #E07A72}
.task.u3 .bang{background:var(--acc);color:var(--card)}
/* Bulles flottantes */
.cloud{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 12px;padding:6px 14px 8px}
.bubble{position:relative;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.bubble.on{box-shadow:0 0 0 3px color-mix(in srgb,var(--d) 75%,var(--ink))}
.bubble .nm{font-size:11.5px;font-weight:700;line-height:1.15;max-width:86%}
.bubble .zn{position:absolute;top:3px;right:3px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--card);color:var(--ink);font-size:11px;font-weight:700;display:grid;place-items:center;box-shadow:0 1px 3px rgba(75,50,45,.16)}
.cnt{position:absolute;top:2px;right:2px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--card);font-size:11px;font-weight:800;display:grid;place-items:center;box-shadow:0 1px 4px rgba(75,50,45,.15)}

/* Personnages (ménage, soins) */
.cb{width:96px;height:96px;--d:var(--ok)}
.cb.todo{--d:var(--todo)}.cb.late{--d:var(--late)}
.cb{background:color-mix(in srgb,var(--d) 26%,var(--card));border:2.5px solid color-mix(in srgb,var(--d) 80%,var(--card))}
.cb .nm{font-size:11px}
.zone{display:flex;align-items:center;gap:8px;margin:14px 20px 2px}
.zone .hf{font-size:16px}
.sched{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.2}
.daypick{display:flex;gap:5px}
.daypick button{width:36px;height:36px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px}
.daypick button.on{background:color-mix(in srgb,#EEB87D 40%,var(--card));border-color:color-mix(in srgb,#EEB87D 75%,var(--ink))}
.cbw{touch-action:manipulation;display:flex;flex-direction:column;align-items:center;gap:6px;width:104px}
.cbw .when{font-size:11px;font-weight:700;color:color-mix(in srgb,var(--d) 60%,var(--ink));--d:var(--ok)}
.cbw .when.todo{--d:var(--todo)}.cbw .when.late{--d:var(--late)}
.cbw .lbl2{font-size:12.5px;font-weight:700;text-align:center;line-height:1.2}
/* Courses */
.search{position:relative;margin:0 20px 10px}
.orga{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px 20px 12px;height:54px;border-radius:20px;background:#F3D3CC;color:var(--ink);font-family:'Zen Maru Gothic',sans-serif;font-size:18px;font-weight:700;box-shadow:0 2px 8px rgba(201,112,106,.18)}
.rthumb{width:54px;height:54px;border-radius:15px;overflow:hidden;flex:none;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.rthumb img{width:100%;height:100%;object-fit:cover}
.addrow{display:flex;gap:8px}.addrow input{flex:1}
.search input,.csearch input{width:100%;height:48px;border-radius:18px;border:1px solid var(--line);background:var(--card);padding:0 16px 0 44px;font:inherit;font-size:15px;color:var(--ink)}
.search svg,.csearch svg{position:absolute;left:15px;top:14px}
.sugg{display:flex;flex-direction:column;gap:6px;margin:0 20px 10px}
.sugg button{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px 0 6px;border-radius:16px;text-align:left;font-size:15px}
.sugg .ic{width:32px;height:32px}
.rstrip{padding:4px 20px 12px}
.rbtn{flex:none;width:52px;height:52px;border-radius:18px;display:grid;place-items:center}
.item{display:flex;align-items:center;gap:10px;min-height:54px;padding:6px 8px 6px 10px;border-radius:18px;--p:14%}
.box{position:relative;width:30px;height:30px;flex:none;border-radius:15px;background:color-mix(in srgb,var(--d) 25%,var(--card));border:1.5px solid color-mix(in srgb,var(--d) 60%,var(--card));display:grid;place-items:center}
.fly .box{background:color-mix(in srgb,var(--d) 75%,var(--card))}
.qty{display:flex;align-items:center;gap:2px;background:var(--card);border-radius:999px;padding:2px;border:1px solid color-mix(in srgb,var(--d) 40%,var(--card))}
.qty button{width:28px;height:28px;border-radius:14px;font-size:16px;font-weight:700;color:var(--muted)}
.qty span{min-width:20px;text-align:center;font-weight:800;font-size:14px}
.qmini{flex:none;display:grid;place-items:center;height:28px;width:28px;border-radius:14px;color:var(--muted);opacity:.75;background:color-mix(in srgb,var(--ink) 4%,var(--card))}
.qp{flex:none;display:flex;align-items:center;height:28px;border-radius:14px;background:var(--card);border:1px solid #D3C4B6;box-shadow:0 1px 3px rgba(75,50,45,.12)}

    <div class="cyleg"><span><i style="background:${PINK}"></i>Règles</span><span><i style="background:#F7E3DE"></i>Prévues</span><span><i style="background:#E3EDD9"></i>Fertile</span></div></div>`;
  const dl=k===TODAY?'Aujourd’hui':DOWL[wd(k)]+' '+pd(k).getDate()+' '+MON[pd(k).getMonth()];

    <div class="cycard"><div class="hf" style="font-size:17px;margin-bottom:10px">${dl}</div>

      <div class="lbl" style="margin-top:12px">Symptômes</div><div class="pick">${syms}</div></div>

const cdTxt=n=>n>0?'J-'+n:n===0?'Jour J':'+'+(-n)+' j';

function calHTML(){
  const views=[['jour','Jour'],['semaine','Semaine'],['mois','Mois']].map(v=>`<button class="${S.view===v[0]?'on':''}" data-a="view" data-v="${v[0]}">${v[1]}</button>`).join('');

  let label;
  if(S.view==='jour')label=DOWL[wd(S.sel)]+' '+selD.getDate()+' '+MON[selD.getMonth()];
  else if(S.view==='semaine'){const a=pd(mon),b=pd(add(mon,6));label=a.getMonth()===b.getMonth()?a.getDate()+' – '+b.getDate()+' '+MON[b.getMonth()]:a.getDate()+' '+MONS[a.getMonth()]+' – '+b.getDate()+' '+MONS[b.getMonth()]}
  else label=MON[selD.getMonth()][0].toUpperCase()+MON[selD.getMonth()].slice(1)+' '+selD.getFullYear();
  let body='',dayTop='';
  if(S.view==='jour'){
    const H=56,list=onDate(S.sel),allday=list.filter(it=>!timed(it)&&!it.due),tl=list.filter(timed);

    if(allday.length)dayTop+=`<div class="avant">${allday.map(it=>`<button class="chip mx ${it.allDay?'adb':''}" style="--d:${TH[it.theme].d};font:inherit;font-size:13px;color:inherit" data-a="${it.link==='courses'?'gocourses':'edit'}" data-id="${it.id}"><span class="ic tint">${kw(it.theme,20)}</span>${esc(it.title)}</button>`).join('')}</div>`;
    let labs='';for(let h=5;h<=23;h++)labs+=`<span class="hl ${tl.some(it=>it.start<h+1&&(it.end||it.start+1)>h)?'':'soft'}" style="top:${(h-5)*H+10}px">${h} h</span>`;
    const lanes=[];const evs=tl.map(it=>{let l=0;while(lanes[l]!==undefined&&lanes[l]>it.start)l++;lanes[l]=it.end||it.start+1;return{it,l}});
    const cards=evs.map(o=>{const it=o.it,end=it.end||it.start+1,ov=evs.some(p=>p!==o&&p.it.start<end&&(p.it.end||p.it.start+1)>it.start);const top=(it.start-5)*H+10,h=Math.max((end-it.start)*H-4,46);
      return `<div class="ev mx" data-a="${it.link==='courses'?'gocourses':'edit'}" data-id="${it.id}" style="cursor:pointer;--d:${TH[it.theme].d};top:${top}px;height:${h}px;left:calc(38px + ${ov?o.l*50:0}% - ${ov?o.l*19:0}px);width:calc(${ov?50:100}% - ${ov?19:38}px)"><span class="ic tint">${kw(it.theme,24)}</span><div style="min-width:0"><div class="ttl">${esc(it.title)}</div><div class="meta">${hm(it.start)} – ${hm(end)}</div>${it.note&&h>=70?`<div class="note" style="-webkit-line-clamp:${h>=110?2:1}">${esc(it.note)}</div>`:''}</div></div>`}).join('');
    body+=`<div class="day" style="height:${18*H+20}px;${adBg(list,22)}border-radius:18px">${labs}${cards}</div>`;
  } else if(S.view==='semaine'){
    let cols='';const wEnd=add(mon,6),bStart=TODAY>mon?TODAY:mon;
    const bands=S.items.filter(it=>it.due&&!it.date&&!it.done&&visible(it)&&it.due>=bStart&&bStart<=wEnd).sort((a,b)=>a.due<b.due?-1:1).slice(0,4);
    for(let i=0;i<7;i++){const k=add(mon,i),list=onDate(k);
      const dl=bands.filter(it=>k>=bStart&&k<=it.due),cm=cyMark(k),bars=dl.length||cm?`<span class="wdots">${dl.map(it=>`<i style="--d:${TH[it.theme].d}"></i>`).join('')}${cm?dropSvg('#EDA5B0',7,cm==='p'?1:.4):''}</span>`:'';
      cols+=`<div class="wcol ${k===TODAY?'today':''} ${i>=5?'we':''}" style="${adBg(list,16)}" data-a="day" data-k="${k}" role="button"><small>${DOW[i]}</small><b>${pd(k).getDate()}</b>${list.map(it=>`<button class="ic tint" style="--d:${TH[it.theme].d}" aria-label="${esc(it.title)}" data-a="goitem" data-id="${it.id}">${kw(it.theme,26)}${it.due&&!it.date?`<span class="flg" style="color:color-mix(in srgb,${TH[it.theme].d} 45%,#4B3D3A)">${FLAG}</span>`:''}</button>`).join('')}${bars}</div>`}
    body=`<div class="week">${cols}</div>${legend()}`;
  } else {
    const start=monday(fk(new Date(selD.getFullYear(),selD.getMonth(),1)));let cells='';
    for(let i=0;i<42;i++){const k=add(start,i),d=pd(k),th=[...new Set(onDate(k).map(x=>x.theme))];cells+=`<button class="mc ${d.getMonth()!==selD.getMonth()?'out':''} ${k===TODAY?'today':''} ${wd(k)>=5?'we':''}" style="${adBg(onDate(k),40)}" data-a="day" data-k="${k}">${(m=>m?`<svg class="cyd" viewBox="0 0 10 12" aria-hidden="true"><path d="M5 .8C3.2 3.6 1.4 5.6 1.4 7.8a3.6 3.6 0 0 0 7.2 0C8.6 5.6 6.8 3.6 5 .8z" fill="#EDA5B0" fill-opacity="${m==='p'?1:.4}"/></svg>`:'')(cyMark(k))}<b>${d.getDate()}</b><span class="mdots">${th.slice(0,6).map(t=>`<i style="--d:${TH[t].d}"></i>`).join('')}</span></button>`}
    body=`<div style="padding:2px 16px 0"><div class="mgrid">${['L','M','M','J','V','S','D'].map((l,i)=>`<div class="mdow ${i>=5?'we':''}">${l}</div>`).join('')}</div><div class="mgrid">${cells}</div></div>${legend()}`;
  }
  const arrow=d=>`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4B3D3A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
  return `<div style="padding:0 20px 8px;display:flex;flex-direction:column;gap:10px"><div class="seg ghost">${views}</div>
    <div class="bar"><button class="nav40 ghost" aria-label="Précédent" data-a="step" data-v="-1">${arrow('M15 18l-6-6 6-6')}</button><div class="hf" style="flex:1;text-align:center;font-size:17px">${label}${S.view==='jour'&&cyMark(S.sel)?' '+dropSvg('#EDA5B0',9,cyMark(S.sel)==='p'?1:.4):''}</div><button class="nav40 ghost" aria-label="Suivant" data-a="step" data-v="1">${arrow('M9 18l6-6-6-6')}</button><button class="today-btn" data-a="today">Aujourd’hui</button></div></div>
    ${dayTop?`<div class="${S._slide||''}">${dayTop}</div>`:''}<div class="scroll" id="calscroll"><div class="${S._slide||''}">${body}</div></div>`;
}

function pips(n,hot){return `<span class="pips ${hot?'hot':''}">${Array.from({length:Math.min(n,6)},()=>'<i></i>').join('')}${n>6?'<em>+</em>':''}</span>`}
function burst(d){const pts=[[0,-30],[26,-16],[28,12],[0,30],[-26,14],[-28,-14],[14,-28],[-14,28]];
  return `<span class="burst">${pts.map((p,i)=>`<i style="--x:${p[0]}px;--y:${p[1]}px">${i%2?`<svg width="10" height="10" viewBox="0 0 10 10"><path d="M5 9C2 7 1 5.5 1 4a2 2 0 0 1 4-.6A2 2 0 0 1 9 4c0 1.5-1 3-4 5z" fill="#EDA5B0"/></svg>`:`<svg width="10" height="10" viewBox="0 0 10 10"><path d="M5 0l1.2 3.8L10 5 6.2 6.2 5 10 3.8 6.2 0 5l3.8-1.2z" fill="${d}"/></svg>`}</i>`).join('')}</span>`}
const swDel=(k,id)=>`<button class="swdel" data-a="swdel" data-v="${k}" data-id="${id}" tabindex="-1">Supprimer</button>`;
function taskCard(it){
  const t=TH[it.theme],urg=it.folder==='urgent',lv=urg?urgLevel(it):0,isTask=it.kind==='tache';
  const nd=it.due?diff(TODAY,it.due):0;const date=it.date?`<span class="dchip ${!it.done&&it.date<TODAY?'late':!it.done&&it.date===TODAY?'today':''}">${ico('cal',14,2)}${short(it.date)}${timed(it)?' · '+hm(it.start):''}</span>`:it.due?`<span class="dchip ${it.done?'':cdCls(nd)}">${FLAG}avant ${short(it.due)}${it.done?'':' · '+cdTxt(nd)}</span>`:'';
  const rep=it.repeat?`<span class="dchip">${ico('repeat',12,2)}${repTxt(it.repeat)}</span>`:'';
  let foot='';
  if(it.done)foot='';
  else if(urg)foot=`<span class="meta">depuis ${diff(it.urgentSince,TODAY)===0?'aujourd’hui':diff(it.urgentSince,TODAY)+' j'}</span><span class="bang" aria-label="Urgence ${lv}">${'!'.repeat(lv)}</span>`;
  else if(isTask&&it.folder==='afaire'){const r=Math.min(it.reports||0,S.seuil);foot=`<span class="dots ${r>=S.seuil-1?'hot':''}" aria-label="Reportée ${r} fois sur ${S.seuil}">${Array.from({length:S.seuil},(_,i)=>`<i class="${i<r?'f':''}"></i>`).join('')}</span><button class="procr" title="Procrastiner" aria-label="Procrastiner" data-a="procrast" data-id="${it.id}">${ART.escargot.replace('width="24" height="18"','width="30" height="22"')}</button>`}
  return `<div class="sw" data-sw="item" data-id="${it.id}">${swDel('item',it.id)}<div class="task mx swc ${it.done?'done':''} ${urg?'u'+lv:''} ${S.pop===it.id?'popcard':''}" style="--d:${t.d}">
    <span class="ic tint tile" style="--d:${t.d}">${kw(it.theme,32)}</span>
    <div class="body" data-a="edit" data-id="${it.id}" style="cursor:pointer"><div class="ttl">${esc(it.title)}</div>${it.note?`<div class="note">${esc(it.note)}</div>`:''}<div style="display:flex;gap:6px;flex-wrap:wrap">${date}${rep}</div></div>
    <button class="chk ${S.pop===it.id?'pop':''}" aria-label="${it.done?'Fait':'À faire'}" data-a="check" data-id="${it.id}">${faceChk(it.done,30)}${S.pop===it.id?burst(t.d):''}</button>
    ${foot?`<div class="foot">${foot}</div>`:''}</div></div>`;

function tasksHTML(){
  const F=[['afaire','À faire','#CEC3BB'],['urgent','Urgent','#E8A094'],['rappels','Rappels','#EEB87D']];
  const inF=(it,f)=>f==='rappels'?it.kind==='rappel':(it.kind==='tache'&&it.folder===f);
  const folders=F.map(f=>{const n=S.items.filter(it=>inF(it,f[0])&&!it.done&&visible(it)).length;return `<button class="fold mx ${S.folder===f[0]?'on':''}" style="--d:${f[2]}" data-a="folder" data-v="${f[0]}" aria-label="${f[1]} : ${n}">${kw(f[0],46)}<span class="l">${f[1]} <span class="fc ${f[0]==='urgent'&&n?'hot':''}">${n}</span></span></button>`}).join('');
  let list=S.items.filter(it=>inF(it,S.folder)&&visible(it)),body='',top='';
  if(S.folder==='afaire'){
    const used=THEMES,cur=S.filter==='all'?null:TH[S.filter];
    top=`<div class="filters"><button class="fb all ${S.filter==='all'?'on':''}" data-a="filter" data-v="all">Tout</button>${used.map(t=>{const n=S.items.filter(it=>inF(it,'afaire')&&it.theme===t.id&&!it.done&&visible(it)).length;return `<button class="fb th ${S.filter===t.id?'on':''}" style="--d:${t.d}" aria-label="${t.name}${n?' : '+n:''}" data-a="filter" data-v="${t.id}">${kw(t.id,23)}${n?`<span class="fbn">${n}</span>`:''}</button>`}).join('')}</div>${cur?`<div style="padding:0 20px 10px;margin-top:-4px" class="fname">${cur.name}</div>`:''}`;
    if(S.filter!=='all')list=list.filter(it=>it.theme===S.filter);
    list.sort((a,b)=>(!!a.done-!!b.done)||((a.date||a.due||'9')<(b.date||b.due||'9')?-1:1));
    body=list.map(taskCard).join('');
    if(!list.length)body=`<div class="empty">${ART.chat}</div>`;
  } else if(S.folder==='urgent'){
    list.sort((a,b)=>(!!a.done-!!b.done)||(urgLevel(b)-urgLevel(a)));body=list.map(taskCard).join('');
    if(!list.length)body=`<div class="empty">${ART.chat}</div>`;
  } else {
    const groups=THEMES.map(t=>({t,its:list.filter(it=>it.theme===t.id)})).filter(g=>g.its.length);
    const cloud=`<div class="cloud">${groups.map(g=>{const n=g.its.filter(x=>!x.done).length,sz=84;return `<button class="bubble mx ${S.rTheme===g.t.id?'on':''}" style="--d:${g.t.d};--p:30%;width:${sz}px;height:${sz}px" data-a="rtheme" data-v="${g.t.id}"><span style="color:color-mix(in srgb,${g.t.d} 55%,#4B3D3A)">${kw(g.t.id,32)}</span><span class="nm">${g.t.name}</span></button>`}).join('')}</div>`;
    const sel=groups.find(g=>g.t.id===S.rTheme);
    body=cloud+(sel?sel.its.sort((a,b)=>(!!a.done-!!b.done)||(a.date<b.date?-1:1)).map(taskCard).join(''):'');
  }
  return `<div class="folders">${folders}</div>${top}<div class="scroll" style="padding:4px 20px 150px;display:flex;flex-direction:column;gap:10px">${body}</div>`;
}

/* ---------- Météo (Open-Meteo, sans clé) ---------- */
const wIcon=c=>c<=1?'beau':c===2?'soleil':(c===3||c===45||c===48)?'nuage':'pluie';
let wBusy=false;
function getPos(){return new Promise((ok,ko)=>{if(!navigator.geolocation)return ko();navigator.geolocation.getCurrentPosition(p=>ok(p.coords),ko,{timeout:9000,maximumAge:30*60000})})}
async function geocode(name){const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=fr&name='+encodeURIComponent(name));const j=await r.json();const g=j.results&&j.results[0];if(!g)throw 0;return{lat:g.latitude,lon:g.longitude,name:g.name}}
async function loadWeather(force){
  if(wBusy)return;if(!force&&W&&W.city===S.city&&nowMs()-W.at<30*60000&&W.days&&W.days[0]&&W.days[0].d<=TODAY)return;
  wBusy=true;
  try{let loc;
    if(S.city==='Ma position'){try{const c=await getPos();loc={lat:c.latitude,lon:c.longitude,name:'Ma position'}}catch(e){loc=await geocode('Roubaix')}}
    else loc=await geocode(S.city);
    const u='https://api.open-meteo.com/v1/forecast?latitude='+loc.lat+'&longitude='+loc.lon+'&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=7';
    const j=await (await fetch(u)).json();
    W={city:S.city,name:loc.name==='Ma position'?'Ici':loc.name,cur:j.current.temperature_2m,icon:wIcon(j.current.weather_code),at:nowMs(),
       days:j.daily.time.map((d,i)=>({d,icon:wIcon(j.daily.weather_code[i]),max:j.daily.temperature_2m_max[i],min:j.daily.temperature_2m_min[i]}))};
    try{localStorage.setItem('ag_weather',JSON.stringify(W))}catch(e){}
    render();
  }catch(e){}finally{wBusy=false}
}
