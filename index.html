button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.page{display:block}
.phone{width:100%;max-width:760px;margin:0 auto;height:100vh;height:100dvh;background:transparent;position:relative;z-index:1;overflow:hidden;display:flex;flex-direction:column;font-family:Nunito,sans-serif}
.hf{font-family:"Zen Maru Gothic",sans-serif;font-weight:700}
.nf{font-family:Nunito,sans-serif;font-weight:700}
.mx{background:color-mix(in srgb,var(--d) var(--p,17%),var(--card));border:1px solid color-mix(in srgb,var(--d) 38%,var(--card))}
.ghost{background:color-mix(in srgb,var(--ink) 6%,var(--bg))}

.ic{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:11px}
header{align-items:center;position:relative}.seasonbg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}.seasonbg i{position:absolute;opacity:.62;line-height:0;will-change:transform;animation-name:fallY;animation-timing-function:cubic-bezier(.2,.65,.3,1);animation-fill-mode:both}.seasonbg b{display:block;line-height:0;will-change:transform;transform:rotate(var(--r));animation-name:flutter;animation-timing-function:ease-in-out;animation-fill-mode:both}@keyframes fallY{from{transform:translate3d(0,-110vh,0)}to{transform:translate3d(0,0,0)}}@keyframes flutter{0%{transform:translate3d(-16px,0,0) rotate(calc(var(--r) - 60deg))}25%{transform:translate3d(16px,0,0) rotate(calc(var(--r) + 25deg))}50%{transform:translate3d(-12px,0,0) rotate(calc(var(--r) - 30deg))}75%{transform:translate3d(6px,0,0) rotate(calc(var(--r) + 10deg))}100%{transform:translate3d(0,0,0) rotate(var(--r))}}.dl1{display:flex;align-items:center;gap:7px}.dtxt .cdp span{font-size:11.5px;color:#B65A6E;font-weight:800;white-space:nowrap}.dtxt .cdp i{font-size:10px}.cdp{flex:none;display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 7px 0 3px;border-radius:10px;background:color-mix(in srgb,#E8798F 9%,var(--card));border:1px solid color-mix(in srgb,#E8798F 22%,var(--card));font-size:11px;font-weight:800;color:#B65A6E;font-family:Nunito,sans-serif}.bilanb{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px 0 8px;border-radius:18px;background:color-mix(in srgb,#F7E3A1 40%,var(--card));border:1px solid color-mix(in srgb,#E3C478 45%,var(--card));font-size:14px;font-weight:700;color:var(--ink)}
.btile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;background:var(--card);border:1px solid var(--line);border-radius:20px;text-align:center}.btile b{font-family:Nunito,sans-serif;font-size:26px;font-weight:800;line-height:1}.btile span{font-size:12px;color:var(--muted);font-weight:600}
.cdp i{font-style:normal;font-weight:700;color:var(--muted);font-size:10.5px}
header{padding:calc(env(safe-area-inset-top) + 4px) 12px 8px 16px;display:flex;align-items:center;gap:8px}
.dnum{font-family:Nunito,sans-serif;font-weight:800;font-size:62px;line-height:.9;letter-spacing:-1.5px}
.dtxt{display:flex;flex-direction:column;line-height:1.15}

.gear{flex:none;width:26px;height:30px;border-radius:15px;display:grid;place-items:center;opacity:.7}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;padding-top:4px;padding-bottom:150px;scrollbar-width:none}
.scroll::-webkit-scrollbar,.hs::-webkit-scrollbar{display:none}

.seg{display:flex;gap:3px;padding:4px;border-radius:16px}

.bar{display:flex;align-items:center;gap:8px}

.ttl{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12px;color:var(--muted)}

.leg{position:relative;display:flex;flex-wrap:wrap;gap:8px 6px;padding:14px 16px 0}
.leg button{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 9px 0 2px;border-radius:999px;font-size:9.5px;font-weight:600;color:var(--muted)}
.leg .ic{width:26px;height:26px;border-radius:13px}
/* Jour */
.day{position:relative;margin:0 14px 0 8px}
.hl{position:absolute;left:6px;width:28px;text-align:right;font-size:12px;color:var(--muted);transform:translateY(-50%);font-weight:600}
.hl.soft{opacity:.45}
.hline{display:none}.tap-off .bubble{filter:grayscale(1) brightness(1.05);opacity:.55;transition:filter .08s,opacity .08s}.tap-on .bubble{filter:none!important;opacity:1!important;--d:#9CCB86!important;transition:filter .08s,opacity .08s}.hair{margin-top:16px;background:#FFF7EE;border:1px solid #F3E1CC;border-radius:20px;padding:4px 14px}.hair summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 0;font-weight:800;font-size:16px;cursor:pointer}.hair summary::-webkit-details-marker{display:none}.hair summary span{flex:1}.hair .chev{transition:transform .2s;color:var(--muted)}.hair[open] .chev{transform:rotate(180deg)}
.hg{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#C98A52;margin:10px 0 4px}.hs{display:flex;gap:10px;padding:7px 0;border-top:1px solid #F3E6D6}.hg+.hs{border-top:0}.hn{flex:none;width:24px;height:24px;border-radius:50%;background:#F6D9B8;color:#8A5A33;font-size:12px;display:grid;place-items:center}.hb{flex:1;min-width:0}.ht{font-weight:700;font-size:14.5px}.hw{font-weight:600;color:var(--muted)}.hp{font-size:13.5px;color:#6B5A55;margin-top:1px}.hfq{display:inline-block;margin:4px 6px 0 0;font-size:11.5px;font-weight:700;color:#3E8FB0}.hfq.pk{color:#C2408F}.sk{font-size:11px;font-weight:800;color:#C98A52;text-transform:uppercase;letter-spacing:.03em;margin-right:4px}.hwarn{margin-top:5px;font-size:12.5px;line-height:1.35;color:#9A5B4E;background:#FBEDEA;border-radius:10px;padding:6px 9px}.skin{margin:0 0 12px}.sks{border-top:1px solid #F3E6D6}.sks>summary{list-style:none;display:flex;gap:10px;padding:8px 0;cursor:pointer}.sks>summary::-webkit-details-marker{display:none}.skm{display:flex;flex-direction:column;min-width:0;flex:1}.skz{font-size:11.5px;color:#B0805A;font-weight:700;margin-top:1px}.skd{padding:0 0 8px 34px}.skd .hp{padding:2px 0}.bzl{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}.bzb{border:1px solid #F3E1CC;background:#FFF7EE;color:#8A5A33;border-radius:14px;padding:6px 11px;font:inherit;font-size:13.5px;font-weight:700}.skalt{width:100%;margin-top:4px;font-size:16px}.seasonbg i.dz{opacity:.34!important}.bdl{background:#FFF4F3;border:1px solid #F6D9DC;border-radius:18px;padding:4px 6px;margin:0 0 12px}.bdr{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:8px 6px;text-align:left;font:inherit;color:var(--ink)}.bdr+.bdr{border-top:1px solid #F6E3E5}.bdn{flex:1;min-width:0;font-weight:700;font-size:15px}.bdd{font-size:13px;color:var(--muted);white-space:nowrap}
.adm{position:relative;aspect-ratio:600/586;opacity:.33;margin:0 auto;max-width:100%}.adm-ly{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease;pointer-events:none}.adm-ly.on{opacity:1;pointer-events:auto}
.adm-i{position:absolute;left:0;bottom:0;width:100%;height:auto;user-select:none;-webkit-user-select:none;will-change:transform}div.adm-i{aspect-ratio:600/586}
.adm-p{position:absolute;inset:0;width:100%;height:100%;user-select:none;-webkit-user-select:none;pointer-events:none}svg.adm-p{overflow:visible}
.adm-lid{transform-box:view-box;transform:scaleY(0)}.adm-blinkL{animation:admBlink 5.6s infinite 1.2s}.adm-blinkM{animation:admBlink 4.3s infinite .4s}
@keyframes admBlink{0%,92%,100%{transform:scaleY(0)}94.5%,95.5%{transform:scaleY(1)}}
.adm-earL{animation:admEar 7.4s ease-in-out infinite 2.4s;--a:5deg}.adm-earR{animation:admEar 7.4s ease-in-out infinite 2.55s;--a:-5deg}
.adm-earM{animation:admEar 6.2s ease-in-out infinite 3.6s;--a:-8deg}.adm-earM2{animation:admEar 8.6s ease-in-out infinite 1.1s;--a:8deg}
@keyframes admEar{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(var(--a))}92%{transform:rotate(calc(var(--a) * -.4))}95%{transform:rotate(0)}}
.adm-wag{animation:admWag 2.6s ease-in-out infinite}@keyframes admWag{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.adm-night .adm-i{bottom:auto;top:32%}.adm-night{translate:0 var(--ns,0px)}
@keyframes admBreath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.006,1.014)}}
@keyframes admTilt{0%,82%,100%{rotate:0deg}87%{rotate:-1.4deg}93%{rotate:.8deg}}
@keyframes admSleep{0%,100%{transform:scale(1,1)}50%{transform:scale(1.008,1.03)}}
.adm-z{position:absolute;top:34%;font:800 15px/1 Nunito,sans-serif;color:#A4BED3;pointer-events:none}.adm-z i{position:absolute;left:0;bottom:0;font-style:normal;opacity:0;animation:admZ 4.8s ease-in-out infinite}.adm-z i:nth-child(2){animation-delay:1.6s;font-size:12px}.adm-z i:nth-child(3){animation-delay:3.2s;font-size:10px}
.adm-z+.adm-z i{animation-duration:5.4s}
@keyframes admZ{0%{opacity:0;transform:translate(0,0)}20%{opacity:.9}70%{opacity:.6}100%{opacity:0;transform:translate(7px,-15px)}}
.adm-t{position:absolute;top:0;bottom:0;width:50%;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}.adm-tl{left:0}.adm-tr{right:0}

.dayart .adm-ly.on{pointer-events:none}

.ev{position:absolute;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:18px;overflow:hidden}

.wcol{position:relative}

.adb{--p:42%;font-weight:700;padding-right:16px}
.cytop{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:12px 16px 12px 8px}
.cycard{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:14px}
.cygrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px 2px;justify-items:center}
.cyc{position:relative;width:38px;height:38px;border-radius:19px;font-size:14px;font-weight:600;color:var(--ink);display:grid;place-items:center}
.cyc.out{opacity:.35}.cyc.p{background:#E8899C;color:#FFFBF5}.cyc.p.p1{background:#FCE6EA;color:#A85A6A}.cyc.p.p3{background:#D9425E;color:#FFFBF5}.cyc.q{background:#F7E3DE}.cyc.f{background:#E3EDD9}
.cyc.today{box-shadow:inset 0 0 0 2px var(--acc)}.cyc.sel{box-shadow:0 0 0 2px var(--ink)}
.cyc.hp{padding-bottom:11px}.cypoo{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);line-height:0}
.cyslq{display:flex;gap:5px;flex:1;min-width:0}.cyslq button{flex:1;min-width:0;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:14px;font-size:10.5px;font-weight:700;line-height:1.1;background:color-mix(in srgb,var(--q) 25%,var(--card));border:1.5px solid color-mix(in srgb,var(--q) 55%,var(--card));color:var(--ink)}.cyslq button.on{background:var(--q);border-color:color-mix(in srgb,var(--q) 70%,var(--ink))}
.cyc i{position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:2px;background:#C4A8C9}

.cysex{display:grid;grid-template-columns:1fr 1fr;gap:6px}.cysex .cyf{flex-direction:row;justify-content:center;height:44px;font-size:13px}

.mc{position:relative}

.cartin button{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 10px 0 4px;border-radius:999px;font-size:13px}
.cartin .ic{width:24px;height:24px;border-radius:12px}
.cat{display:flex;flex-wrap:wrap;gap:8px}
.cat button{height:38px;padding:0 14px;border-radius:999px;font-size:14px;background:var(--card);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.cat button.in{background:color-mix(in srgb,var(--d) 35%,var(--card));border-color:color-mix(in srgb,var(--d) 65%,var(--card));font-weight:700}
.csearch{position:sticky;bottom:-38px;margin:0 -20px -38px;padding:12px 20px 38px;background:var(--bg)}
/* Météo semaine */
.wday{display:flex;align-items:center;gap:12px;padding:8px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.wday .d{font-weight:700;font-size:14px;white-space:nowrap}.wday.today{border:2px solid #A4BED3;padding:7px 13px}.wday .r{display:flex;align-items:center;gap:3px;margin-left:auto;font-size:12.5px;font-weight:700;color:#6F8BA6}.wday .r+.t{margin-left:14px}
.wday .t{margin-left:auto;font-weight:700;font-size:15px;min-width:64px;text-align:right}
.wday .t small{font-weight:500;color:var(--muted);margin-left:6px}
/* Commun */
.fab.low{bottom:calc(var(--nb) + 78px)!important}.fab{position:absolute;right:20px;bottom:calc(var(--nb) + 86px);width:46px;height:46px;border-radius:23px;background:var(--acc);display:grid;place-items:center;background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 78%,#fff),var(--acc) 60%);box-shadow:0 5px 12px rgba(207,107,100,.34);z-index:5}.fab svg{width:20px;height:20px}
nav{position:absolute;left:10px;right:10px;bottom:var(--nb);height:70px;border-radius:26px;background:#FBF0EE;border:1.5px solid #F1DEDA;box-shadow:0 3px 10px rgba(75,50,45,.10);display:flex;gap:3px;padding:6px;z-index:5}
nav button{flex:1;min-width:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:#9A8A82;font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden}
nav button.on{background:color-mix(in srgb,var(--tc) 55%,#fff);color:var(--ink)}
nav button:not(.on) svg{filter:saturate(.85);opacity:.95}
.bigcloud{padding:6px 0 140px;display:flex;flex-direction:column}
.scat{position:relative;flex:1;min-height:640px;padding:0!important;display:block!important}
.bubble.blob{border:none!important;background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--d) 10%,#fff) 0%,color-mix(in srgb,var(--d) 30%,#fff) 68%,color-mix(in srgb,var(--d) 50%,#fff) 100%)!important;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--d) 42%,#fff),inset -5px -7px 12px color-mix(in srgb,var(--d) 26%,transparent),0 3px 8px rgba(120,90,80,.10)}
.bubble.blob::after{content:'';position:absolute;left:19%;top:14%;width:24%;height:14%;border-radius:50%;border-top:3px solid rgba(255,255,255,.95);transform:rotate(-28deg);pointer-events:none}
.bubble.blob::before{content:'';position:absolute;left:17%;top:31%;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.9);pointer-events:none}.bigcloud .cbw{justify-self:center}.bigcloud .lbl2{font-size:15px!important}
.undo{position:absolute;left:20px;bottom:calc(var(--nb) + 84px);z-index:6;height:52px;padding:0 14px 0 12px;border-radius:26px;background:#8C7A73;display:flex;align-items:center;gap:6px;box-shadow:0 8px 20px rgba(75,50,45,.25)}
.toast{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 6px);z-index:40;padding:10px 16px 10px 10px;border-radius:22px;background:var(--acc);color:var(--card);font-size:14px;font-weight:700;box-shadow:0 10px 26px rgba(207,107,100,.35);display:flex;align-items:center;gap:10px}
.empty{display:flex;flex-direction:column;align-items:center;padding:24px 0}
.veil{position:absolute;inset:0;z-index:30;background:rgba(75,61,58,.28);display:flex;flex-direction:column;justify-content:flex-end}
.sheet{background:var(--bg);border-radius:28px 28px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column;gap:16px;max-height:88%;overflow-y:auto}
.sheet>*{flex-shrink:0}
.sheet label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.sheet textarea{min-height:46px;border-radius:16px;border:1px solid var(--line);background:var(--card);padding:12px 16px;font:inherit;font-size:16px;line-height:1.35;color:var(--ink);resize:none;-webkit-user-select:text;user-select:text}
.note{font-size:12.5px;line-height:1.3;color:color-mix(in srgb,var(--muted) 75%,var(--card));white-space:pre-line;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:-1px}
.sw{position:relative;border-radius:22px;overflow:hidden;flex:none}
.swdel{position:absolute;top:0;right:0;bottom:0;width:104px;display:flex;align-items:center;justify-content:center;background:#E8A094;color:#FFFBF5;font-size:14px;font-weight:700;border-radius:0 22px 22px 0;padding-left:14px}
.swc{position:relative;z-index:1;transition:transform .22s ease;will-change:transform}
.sw.drag .swc{transition:none}
.swdel{visibility:hidden}.sw.drag .swdel,.sw.open .swdel{visibility:visible}
.sheet input{height:50px;border-radius:16px;border:1px solid var(--line);background:var(--card);padding:0 16px;font:inherit;font-size:16px;color:var(--ink)}
.step{width:42px;height:42px;border-radius:21px;font-size:20px}
.big{height:52px;border-radius:16px;background:var(--ink);color:var(--card);font-size:16px;font-weight:700}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{height:38px;padding:0 12px 0 5px;border-radius:999px;font-size:13px;background:var(--card);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.pick button .ic{width:28px;height:28px;border-radius:14px}
.pick button.on{background:color-mix(in srgb,var(--d) 35%,var(--card));border-color:color-mix(in srgb,var(--d) 70%,var(--ink));font-weight:700}
.pick button.txt{padding:0 14px}
.lbl{font-size:13px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.gate form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.gate input{width:100%;height:50px;border-radius:16px;border:1px solid var(--line);background:var(--card);padding:0 16px;font:inherit;font-size:16px;color:var(--ink)}
.gate .big{width:100%}
.syncdot{width:7px;height:7px;border-radius:4px;display:inline-block;margin-left:6px;vertical-align:middle}
.danger{height:46px;border-radius:16px;background:transparent;color:var(--red);font-size:15px;font-weight:700;border:1px solid #EBB3AC}
.sheet.ed{gap:12px;padding-top:16px}.sheet.ed .big{height:48px}.sheet.ed input,.sheet.ed .din{height:44px}
.sheet.ed textarea{padding:11px 16px}
.thg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.thg button{height:40px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--d) 20%,var(--card));border:1px solid color-mix(in srgb,var(--d) 40%,var(--card))}
.thg button.on{background:color-mix(in srgb,var(--d) 45%,var(--card));box-shadow:0 0 0 2px var(--ink)}
.f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.cell{display:flex;flex-direction:column;gap:4px;min-width:0}.cell .din{min-width:0;width:100%}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px}.frow select{min-width:170px}
.adt{height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;color:var(--muted)}
.adt.on{background:color-mix(in srgb,var(--acc) 30%,var(--card));border-color:var(--acc);color:var(--ink)}
.daterow{display:flex;align-items:center;justify-content:space-between;gap:10px}
</style>
</head>

    return sb.from('agenda_push').upsert({endpoint:sub.endpoint,user_id:userId,sub,tz},{onConflict:'endpoint'}).then(r=>{if(r.error)return false;try{localStorage.setItem('ag_push',sub.endpoint)}catch(e){}return true},()=>false)}
  function testPush(){if(!sb||!userId)return Promise.resolve(null);return sb.functions.invoke('agenda-push',{body:{test:true}}).then(r=>r.data,()=>null)}
  function refreshPush(){if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)||Notification.permission!=='granted')return;
    navigator.serviceWorker.ready.then(reg=>reg.pushManager.getSubscription()).then(sub=>{if(sub){S.pushOn=true;savePush(sub.toJSON())}}).catch(()=>{})}
  return{schedule,push,pull,boot,signIn,pushImg,delImg,fetchImgs,savePush,testPush,refreshPush,ready:()=>!!sb};
})();
function persistQuiet(){const state={};PKEYS.forEach(k=>state[k]=S[k]);try{localStorage.setItem(LSK,JSON.stringify({state,synced:SY.synced,dirty:SY.dirty}))}catch(e){}}
let gateEl=null;
function showGate(){if(gateEl){gateEl.hidden=false;return}
  gateEl=document.createElement('div');gateEl.className='gate';
  gateEl.innerHTML=`<form novalidate>${kw('calendrier',90)}<div class="hf" style="font-size:22px">Agenda d’Alina</div>
    <input type="email" name="email" autocomplete="username" placeholder="Adresse e-mail" autocapitalize="none" autocorrect="off">
    <input type="password" name="password" autocomplete="current-password" placeholder="Code d’accès">
    <p class="meta" role="alert" style="min-height:16px;margin:0;color:var(--red)"></p><button class="big" type="submit">Se connecter</button></form>`;
  document.body.appendChild(gateEl);
  const f=gateEl.querySelector('form'),msg=f.querySelector('p');
  f.addEventListener('submit',ev=>{ev.preventDefault();const e=f.email.value.trim(),p=f.password.value;if(!e||!p){msg.textContent='E-mail et code nécessaires.';return}
    if(!sync.ready()){msg.textContent='Connexion impossible pour l’instant.';return}
    msg.textContent='…';sync.signIn(e,p).then(r=>{if(r.error){msg.textContent=/invalid/i.test(r.error.message)?'E-mail ou code incorrect.':'Connexion impossible pour l’instant.';return}msg.textContent=''},()=>{msg.textContent='Connexion impossible pour l’instant.'})})}
function hideGate(){if(gateEl)gateEl.hidden=true}

/* ---------- Démarrage ---------- */
function refreshDay(){const d=new Date(),m=d.getMonth()+1,j=d.getDate(),k=d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(j<10?'0':'')+j;if(k!==TODAY){if(S.sel===TODAY)S.sel=k;TODAY=k;housekeeping();render()}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){refreshDay();loadWeather()}});
setInterval(refreshDay,60000);
loadImgs().then(n=>{if(n)render()});
housekeeping();
render();
loadWeather();
(function waitLib(n){if(window.supabase&&window.supabase.createClient)sync.boot();else if(n<60)setTimeout(()=>waitLib(n+1),250);else{authed()?hideGate():showGate()}})(0);
const APP_VER='156';
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{}));
function checkUpdate(){if(location.protocol!=='https:'||!navigator.onLine)return;
  fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(v=>{
    if(!v||String(v.v)===APP_VER)return;
    if(sessionStorage.getItem('ag_upd')===String(v.v))return;sessionStorage.setItem('ag_upd',String(v.v));
    const go=()=>location.reload();
    if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration)navigator.serviceWorker.getRegistration().then(r=>r?r.update().catch(()=>{}):0).finally(()=>setTimeout(go,300));else go();
  }).catch(()=>{})}
window.addEventListener('load',checkUpdate);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
</script>
