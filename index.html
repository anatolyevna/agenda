<style>
:root{--bg:#FCF4EB;--card:#FFFBF5;--ink:#4B3D3A;--muted:#7C6A63;--line:#F0E1D4;--acc:#CF6B64;--red:#A9433C;--ok:#9DBF86;--todo:#EFA3B4;--late:#E28F86}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);height:100%;overscroll-behavior:none}
body{position:fixed;inset:0;overflow:hidden}
body{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
input,textarea,select{font-size:16px!important}
.qx{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:16px;background:color-mix(in srgb,var(--ink) 8%,var(--card));color:var(--muted);font-size:20px;line-height:1;display:none;place-items:center}.qx.on{display:grid}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.page{display:block}
.phone{width:100%;max-width:760px;margin:0 auto;height:100vh;height:100dvh;background:transparent;position:relative;z-index:1;overflow:hidden;display:flex;flex-direction:column;font-family:Nunito,sans-serif}
.hf{font-family:"Zen Maru Gothic",sans-serif;font-weight:700}
.nf{font-family:Nunito,sans-serif;font-weight:700}
.mx{background:color-mix(in srgb,var(--d) var(--p,17%),var(--card));border:1px solid color-mix(in srgb,var(--d) 38%,var(--card))}
.ghost{background:color-mix(in srgb,var(--ink) 6%,var(--bg))}
.tint{background:color-mix(in srgb,var(--d) 31%,var(--card));color:color-mix(in srgb,var(--d) 50%,var(--ink))}
.ic{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:11px}
header{align-items:center;position:relative}.seasonbg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}.seasonbg i{position:absolute;opacity:.62;line-height:0;will-change:transform;animation-name:fallY;animation-timing-function:cubic-bezier(.2,.65,.3,1);animation-fill-mode:both}.seasonbg b{display:block;line-height:0;will-change:transform;transform:rotate(var(--r));animation-name:flutter;animation-timing-function:ease-in-out;animation-fill-mode:both}@keyframes fallY{from{transform:translate3d(0,-110vh,0)}to{transform:translate3d(0,0,0)}}@keyframes flutter{0%{transform:translate3d(-16px,0,0) rotate(calc(var(--r) - 60deg))}25%{transform:translate3d(16px,0,0) rotate(calc(var(--r) + 25deg))}50%{transform:translate3d(-12px,0,0) rotate(calc(var(--r) - 30deg))}75%{transform:translate3d(6px,0,0) rotate(calc(var(--r) + 10deg))}100%{transform:translate3d(0,0,0) rotate(var(--r))}}.dl1{display:flex;align-items:center;gap:7px}.dtxt .cdp span{font-size:11.5px;color:#B65A6E;font-weight:800;white-space:nowrap}.dtxt .cdp i{font-size:10px}.cdp{flex:none;display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 7px 0 3px;border-radius:10px;background:color-mix(in srgb,#E8798F 9%,var(--card));border:1px solid color-mix(in srgb,#E8798F 22%,var(--card));font-size:11px;font-weight:800;color:#B65A6E;font-family:Nunito,sans-serif}.bilanb{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px 0 8px;border-radius:18px;background:color-mix(in srgb,#F7E3A1 40%,var(--card));border:1px solid color-mix(in srgb,#E3C478 45%,var(--card));font-size:14px;font-weight:700;color:var(--ink)}
.btile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;background:var(--card);border:1px solid var(--line);border-radius:20px;text-align:center}.btile b{font-family:Nunito,sans-serif;font-size:26px;font-weight:800;line-height:1}.btile span{font-size:12px;color:var(--muted);font-weight:600}
.cdp i{font-style:normal;font-weight:700;color:var(--muted);font-size:10.5px}
header{padding:calc(env(safe-area-inset-top) + 4px) 12px 8px 16px;display:flex;align-items:center;gap:8px}
.dnum{font-family:Nunito,sans-serif;font-weight:800;font-size:62px;line-height:.9;letter-spacing:-1.5px}
.dtxt{display:flex;flex-direction:column;line-height:1.15}
.dtxt b{font-family:"Zen Maru Gothic",sans-serif;font-size:25px}
.dtxt span{font-size:19px;color:var(--muted);font-weight:600;white-space:nowrap}
.wx{flex:1;min-width:0;justify-content:center;display:flex;align-items:center;gap:8px;padding:5px 11px 5px 4px;border-radius:20px;--d:#A4BED3;text-align:left}
.wx small{display:block;font-size:12px;color:var(--muted);line-height:1.25;white-space:nowrap}
.gear{flex:none;width:26px;height:30px;border-radius:15px;display:grid;place-items:center;opacity:.7}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;padding-top:4px;padding-bottom:150px;scrollbar-width:none}
.scroll::-webkit-scrollbar,.hs::-webkit-scrollbar{display:none}
.hs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.seg{display:flex;gap:3px;padding:4px;border-radius:16px}
.seg button{flex:1;height:40px;border-radius:12px;font-size:14px;color:var(--muted)}

.bar{display:flex;align-items:center;gap:8px}

.ttl{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12px;color:var(--muted)}
/* Légende (petites bulles, sans titre) */
.lgn{position:absolute;top:-4px;right:-3px;min-width:12px;height:12px;padding:0 3px;border-radius:6px;background:var(--card);color:var(--muted);font-size:8px;font-weight:700;line-height:12px;text-align:center;box-shadow:0 1px 2px rgba(75,50,45,.15)}
.leg{display:flex;flex-wrap:wrap;gap:8px 6px;padding:14px 16px 0}

.leg .ic{width:26px;height:26px;border-radius:13px}
/* Jour */
.day{position:relative;margin:0 14px 0 8px}
.hl{position:absolute;left:0;width:30px;text-align:right;font-size:12px;color:var(--muted);transform:translateY(-50%);font-weight:600}
.hl.soft{opacity:.45}
.hline{position:absolute;left:38px;right:0;height:0;border-top:1.5px dotted color-mix(in srgb,var(--ink) 13%,transparent)}
.adm{position:relative;aspect-ratio:600/586;margin:0 auto;max-width:100%}.adm-ly{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease;pointer-events:none}.adm-ly.on{opacity:1;pointer-events:auto}
.adm-i{position:absolute;left:0;bottom:0;width:100%;height:auto;user-select:none;-webkit-user-select:none;will-change:transform}
.adm-day .adm-l{transform-origin:34% 100%;animation:admBreath 4.2s ease-in-out infinite}.adm-day .adm-r{transform-origin:66% 100%;animation:admBreath 3.4s ease-in-out -1.3s infinite,admTilt 9s ease-in-out 2s infinite}
.adm-night .adm-i{bottom:6%}.adm-night .adm-l{transform-origin:24% 100%;animation:admSleep 5.2s ease-in-out infinite}.adm-night .adm-r{transform-origin:72% 100%;animation:admSleep 4.6s ease-in-out -2s infinite}
@keyframes admBreath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.006,1.014)}}
@keyframes admTilt{0%,82%,100%{rotate:0deg}87%{rotate:-1.4deg}93%{rotate:.8deg}}
@keyframes admSleep{0%,100%{transform:scale(1,1)}50%{transform:scale(1.008,1.03)}}
.adm-z{position:absolute;top:34%;font:800 15px/1 Nunito,sans-serif;color:#A4BED3;pointer-events:none}.adm-z i{position:absolute;left:0;bottom:0;font-style:normal;opacity:0;animation:admZ 4.8s ease-in-out infinite}.adm-z i:nth-child(2){animation-delay:1.6s;font-size:12px}.adm-z i:nth-child(3){animation-delay:3.2s;font-size:10px}
.adm-z+.adm-z i{animation-duration:5.4s}
@keyframes admZ{0%{opacity:0;transform:translate(0,0)}20%{opacity:.9}70%{opacity:.6}100%{opacity:0;transform:translate(14px,-26px)}}
.adm-t{position:absolute;top:0;bottom:0;width:50%;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}.adm-tl{left:0}.adm-tr{right:0}
.adm .adm-i.adm-hop{animation:admHop .8s ease}@keyframes admHop{0%,100%{transform:none}30%{transform:translateY(-5%) scale(1.02)}55%{transform:translateY(0) scale(.99,1.01)}75%{transform:translateY(-1.5%)}}
.adm .adm-i.adm-stir{animation:admStir 1s ease}@keyframes admStir{0%,100%{transform:none}30%{transform:rotate(-1.4deg) scale(1.01)}60%{transform:rotate(1deg)}}
.adm-pause *{animation-play-state:paused!important}
@media (prefers-reduced-motion: reduce){.adm *{animation:none!important}.adm-ly{transition:none}}
.dayart .adm-ly.on{pointer-events:none}
.dayart{position:absolute;left:50%;top:calc(50% - 45px);transform:translate(-50%,-50%);opacity:.45;pointer-events:none;z-index:0}
.ev{position:absolute;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:18px;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:12px;font-size:13px}

.wbar{position:absolute;left:-2px;right:-2px;height:3px;background:color-mix(in srgb,var(--d) 55%,transparent)}
.wbar.s{left:5px;border-radius:3px 0 0 3px}.wbar.e{right:5px;border-radius:0 3px 3px 0}.wbar.s.e{border-radius:3px}
.flg{position:absolute;top:-5px;right:-6px;width:17px;height:17px;border-radius:9px;background:var(--card);display:grid;place-items:center;box-shadow:0 1px 3px rgba(75,50,45,.18)}
.adb{--p:42%;font-weight:700;padding-right:16px}
.cytop{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:12px 16px 12px 8px}

.cygrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px 2px;justify-items:center}

.cyf.on{background:#FBE3E6;border-color:#EDA5B0;color:var(--ink)}
.cysex{display:grid;grid-template-columns:1fr 1fr;gap:6px}.cysex .cyf{flex-direction:row;justify-content:center;height:44px;font-size:13px}
.cymoods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}

.cym.on{background:#FBE3E6;border-color:#EDA5B0;color:var(--ink)}
.cyd{position:absolute;bottom:3px;left:50%;margin-left:-3.5px;width:7px;height:8.4px}
.mc{position:relative}
.cyw{position:absolute;left:0;right:0;bottom:4px;display:flex;justify-content:center;line-height:0}
.cyl{position:absolute;left:8px;right:8px;bottom:2px;height:2px;border-radius:1px;background:#EDA5B0}.cyl.q{background:#F3D3D7}
.avant{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.wcol small{font-size:10px;color:var(--muted)}
.wcol b{font-weight:500;font-size:18px;line-height:1.1;margin-bottom:4px}
.wcol .ic{width:36px;height:36px;border-radius:12px}
/* Mois */
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mdow{text-align:center;font-size:12px;color:var(--muted);padding-bottom:6px}
.mc{height:58px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding-top:6px;display:flex;flex-direction:column;align-items:center;gap:4px}
.mc.we{background:color-mix(in srgb,#C4A8C9 16%,var(--card));border-color:color-mix(in srgb,#C4A8C9 35%,var(--card))}.mc.we b{color:#7E5F86}
.mdow.we{color:#7E5F86;font-weight:700}
.mc.pz::before{content:'';position:absolute;inset:0;border-radius:inherit;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2212%22%20height%3D%2212%22%3E%3Ccircle%20cx%3D%220.75%22%20cy%3D%220.75%22%20r%3D%22.55%22%20fill%3D%22%23E8798F%22/%3E%3Ccircle%20cx%3D%222.25%22%20cy%3D%222.25%22%20r%3D%22.55%22%20fill%3D%22%23E8798F%22/%3E%3Ccircle%20cx%3D%223.75%22%20cy%3D%223.75%22%20r%3D%22.55%22%20fill%3D%22%23E8798F%22/%3E%3Ccircle%20cx%3D%225.25%22%20cy%3D%225.25%22%20r%3D%22.55%22%20fill%3D%22%23E8798F%22/%3E%3Ccircle%20cx%3D%226.75%22%20cy%3D%226.75%22%20r%3D%22.55%22%20fill%3D%22%23E8798F%22/%3E%3Ccircle%20cx%3D%228.25%22%20cy%3D%228.25%22%20r%3D%22.55%22%20fill%3D%22%23E8798F%22/%3E%3Ccircle%20cx%3D%229.75%22%20cy%3D%229.75%22%20r%3D%22.55%22%20fill%3D%22%23E8798F%22/%3E%3Ccircle%20cx%3D%2211.25%22%20cy%3D%2211.25%22%20r%3D%22.55%22%20fill%3D%22%23E8798F%22/%3E%3Ccircle%20cx%3D%226.75%22%20cy%3D%220.75%22%20r%3D%22.55%22%20fill%3D%22%23F0A2B2%22/%3E%3Ccircle%20cx%3D%220.75%22%20cy%3D%226.75%22%20r%3D%22.55%22%20fill%3D%22%23F0A2B2%22/%3E%3Ccircle%20cx%3D%228.25%22%20cy%3D%222.25%22%20r%3D%22.55%22%20fill%3D%22%23F0A2B2%22/%3E%3Ccircle%20cx%3D%222.25%22%20cy%3D%228.25%22%20r%3D%22.55%22%20fill%3D%22%23F0A2B2%22/%3E%3Ccircle%20cx%3D%229.75%22%20cy%3D%223.75%22%20r%3D%22.55%22%20fill%3D%22%23F0A2B2%22/%3E%3Ccircle%20cx%3D%223.75%22%20cy%3D%229.75%22%20r%3D%22.55%22%20fill%3D%22%23F0A2B2%22/%3E%3Ccircle%20cx%3D%2211.25%22%20cy%3D%225.25%22%20r%3D%22.55%22%20fill%3D%22%23F0A2B2%22/%3E%3Ccircle%20cx%3D%225.25%22%20cy%3D%2211.25%22%20r%3D%22.55%22%20fill%3D%22%23F0A2B2%22/%3E%3C/svg%3E") 0 0/12px 12px repeat;opacity:.7;pointer-events:none;z-index:0}.mcake{display:inline-block;line-height:0;margin:-3px 0 -2px}

.mdots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:36px}.mdots i{width:7px;height:7px;border-radius:4px;background:var(--d)}
/* Tâches */

.sw.minor{margin-left:24px}
.qn{display:flex;gap:8px;align-items:flex-end}.qn textarea{resize:none;overflow:hidden;line-height:1.4;padding:13px 16px!important;display:block}.qn input,.qn textarea{flex:1;min-width:0;min-height:50px;border-radius:18px;border:1px solid var(--line);background:var(--card);padding:0 16px;font:inherit;color:var(--ink)}.qn button{flex:none;width:50px;height:50px;border-radius:18px;background:#E3C478;display:grid;place-items:center}

.folders{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:0 20px 12px}
.fold{border-radius:22px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;--p:12%;opacity:.85}

function taskCard(it){
  const t=TH[it.theme],urg=it.folder==='urgent',lv=urg?urgLevel(it):0,isTask=it.kind==='tache';
  const nd=it.due?diff(TODAY,it.due):0;const date=it.date?`<span class="dchip ${!it.done&&it.date<TODAY?'late':!it.done&&it.date===TODAY?'today':''}">${ico('cal',14,2)}${short(it.date)}${timed(it)?' · '+hm(it.start):''}</span>`:it.due?`<span class="dchip ${it.done?'':cdCls(nd)}">${FLAG}avant ${short(it.due)}${it.done?'':' · '+cdTxt(nd)}</span>`:'';

  return `<div class="sw ${isMinor(it)?'minor':''}" data-sw="item" data-id="${it.id}">${swDel('item',it.id)}<div class="task mx swc ${it.done?'done':''} ${urg?'u'+lv:''} ${S.pop===it.id?'popcard':''}" style="--d:${t.d}">

function tasksHTML(){
  const F=[['afaire','À faire','#ECE6F7'],['urgent','Urgent','#E8A094'],['rappels','Rappels','#EEB87D'],['notes','Notes','#F7E3A1']];
  const inF=(it,f)=>f==='rappels'?it.kind==='rappel':(it.kind==='tache'&&it.folder===f);
  const folders=F.map(f=>{const n=f[0]==='notes'?(S.notes||[]).length:S.items.filter(it=>inF(it,f[0])&&!it.done&&visible(it)).length;return `<button class="fold mx ${S.folder===f[0]?'on':''}" style="--d:${f[2]}" data-a="folder" data-v="${f[0]}" aria-label="${f[1]} : ${n}">${kw(f[0],46)}<span class="l">${f[1]} <span class="fc ${f[0]==='urgent'&&n?'hot':''}">${n}</span></span></button>`}).join('');
  let list=S.items.filter(it=>inF(it,S.folder)&&visible(it)&&(!it.done||nowMs()-(it.doneAt||0)<4000)),body='',top='';
  if(S.folder==='afaire'){

    top=`<div class="filters"><button class="fb all ${S.filter==='all'?'on':''}" data-a="filter" data-v="all">Tout</button>${used.map(t=>{const n=S.items.filter(it=>inF(it,'afaire')&&it.theme===t.id&&!it.done&&visible(it)).length;return `<button class="fb th ${S.filter===t.id?'on':''}" style="--d:${t.d}" aria-label="${t.name}${n?' : '+n:''}" data-a="filter" data-v="${t.id}">${kw(t.id,23)}${n?`<span class="fbn">${n}</span>`:''}</button>`}).join('')}</div>${cur?`<div style="padding:0 20px 10px;margin-top:-4px" class="fname">${cur.name}</div>`:''}`;

  } else if(S.folder==='notes'){
    body=`<div class="qn"><textarea id="qnote" rows="1" placeholder="Note rapide" autocomplete="off">${esc(S.qnT||'')}</textarea><button aria-label="Ajouter" data-a="qnadd"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFBF5" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>`
      +[...(S.notes||[])].reverse().map(n=>`<div class="qnc"><div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:600;white-space:pre-wrap;word-break:break-word">${esc(n.t)}</div><div class="meta" style="font-size:12px;margin-top:2px">${pd(n.at).getDate()} ${MONS[pd(n.at).getMonth()]}</div></div><button class="qnto" data-a="qnto" data-id="${n.id}">${kw('afaire',20)}À faire</button><button class="qnx" aria-label="Supprimer" data-a="qndel" data-id="${n.id}">×</button></div>`).join('');
  } else if(S.folder==='urgent'){
    list.sort((a,b)=>(!!a.done-!!b.done)||(urgLevel(b)-urgLevel(a)));body=list.map(taskCard).join('');
    if(!list.length)body=`<div class="empty" style="opacity:.75;position:absolute;left:0;right:0;top:0;bottom:96px;justify-content:center;padding:0">${AnimatedDogMascots(300)}</div>`;
  } else {
    const groups=THEMES.map(t=>({t,its:list.filter(it=>it.theme===t.id)})).filter(g=>g.its.length);
    const cloud=`<div class="cloud">${groups.map(g=>{const n=g.its.filter(x=>!x.done).length,sz=84;return `<button class="bubble mx ${S.rTheme===g.t.id?'on':''}" style="--d:${g.t.d};--p:30%;width:${sz}px;height:${sz}px" data-a="rtheme" data-v="${g.t.id}"><span style="color:color-mix(in srgb,${g.t.d} 55%,#4B3D3A)">${kw(g.t.id,32)}</span><span class="nm">${g.t.name}</span></button>`}).join('')}</div>`;

    body=cloud+(sel?sel.its.sort((a,b)=>(!!a.done-!!b.done)||(a.date<b.date?-1:1)).map(taskCard).join(''):'');

  return `<div class="folders">${folders}</div>${top}<div class="scroll" style="padding:4px 20px 150px;display:flex;flex-direction:column;gap:10px;position:relative">${body}</div>`;

  gateEl=document.createElement('div');gateEl.className='gate';
  gateEl.innerHTML=`<form novalidate>${kw('calendrier',90)}<div class="hf" style="font-size:22px">Agenda d’Alina</div>
    <input type="email" name="email" autocomplete="username" placeholder="Adresse e-mail" autocapitalize="none" autocorrect="off">
    <input type="password" name="password" autocomplete="current-password" placeholder="Code d’accès">
    <p class="meta" role="alert" style="min-height:16px;margin:0;color:var(--red)"></p><button class="big" type="submit">Se connecter</button></form>`;
  document.body.appendChild(gateEl);
  const f=gateEl.querySelector('form'),msg=f.querySelector('p');
  f.addEventListener('submit',ev=>{ev.preventDefault();const e=f.email.value.trim(),p=f.password.value;if(!e||!p){msg.textContent='E-mail et code nécessaires.';return}
    if(!sync.ready()){msg.textContent='Connexion impossible pour l’instant.';return}
    msg.textContent='…';sync.signIn(e,p).then(r=>{if(r.error){msg.textContent=/invalid/i.test(r.error.message)?'E-mail ou code incorrect.':'Connexion impossible pour l’instant.';return}msg.textContent=''},()=>{msg.textContent='Connexion impossible pour l’instant.'})})}
function hideGate(){if(gateEl)gateEl.hidden=true}

/* ---------- Démarrage ---------- */
function refreshDay(){const d=new Date(),m=d.getMonth()+1,j=d.getDate(),k=d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(j<10?'0':'')+j;if(k!==TODAY){if(S.sel===TODAY)S.sel=k;TODAY=k;housekeeping();render()}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){refreshDay();loadWeather()}});
setInterval(refreshDay,60000);
loadImgs().then(n=>{if(n)render()});
housekeeping();
render();
loadWeather();
(function waitLib(n){if(window.supabase&&window.supabase.createClient)sync.boot();else if(n<60)setTimeout(()=>waitLib(n+1),250);else{authed()?hideGate():showGate()}})(0);
const APP_VER='74';
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{}));
function checkUpdate(){if(location.protocol!=='https:'||!navigator.onLine)return;
  fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(v=>{
    if(!v||String(v.v)===APP_VER)return;
    if(sessionStorage.getItem('ag_upd')===String(v.v))return;sessionStorage.setItem('ag_upd',String(v.v));
    const go=()=>location.reload();
    if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration)navigator.serviceWorker.getRegistration().then(r=>r?r.update().catch(()=>{}):0).finally(()=>setTimeout(go,300));else go();
  }).catch(()=>{})}
window.addEventListener('load',checkUpdate);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
</script>
</body>
